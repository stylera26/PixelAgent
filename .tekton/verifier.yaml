# CI Tekton (devops/cicd, pipeline verifier, type yaml) : tests sur chaque MR vers develop (ou main pendant la bascule).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: verifier
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[develop, main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/pipeline: "https://gitlab.com/nas-sty/devops/cicd/-/raw/v0.6.0/pipelines/verifier.yaml"
spec:
  pipelineRef: {name: verifier}
  params:
    - {name: url, value: "{{ repo_url }}"}
    - {name: revision, value: "{{ revision }}"}
    - {name: git-auth-secret, value: "{{ git_auth_secret }}"}
    - {name: type, value: yaml}
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          storageClassName: local-path   # nœud nasty : pas de Longhorn
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 1Gi}}